  --ink:#10231e; --muted:#6b7c76; --bg:#f4f1ea; --card:#fffdf8; --line:#e6e0d2;
  --g1:#0b3d33; --g2:#0f5a4a; --g3:#16795f; --gold:#d9b25f; --gold2:#b98d35;
  --red:#c0392b; --ok:#1f8a5b; --warn:#c77d12;
  --sh:0 10px 30px -12px rgba(11,61,51,.35); --r:20px;
  --font:'Noto Sans Bengali','Hind Siliguri','Nirmala UI',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px}
body{overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
#app{min-height:100%;max-width:720px;margin:0 auto;position:relative}

/* ---- header ---- */
.hero{background:radial-gradient(120% 140% at 85% -10%,#1d8a6e 0,transparent 55%),linear-gradient(160deg,var(--g1),var(--g2));
  color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 20px 70px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:26px solid rgba(217,178,95,.16)}
.hero h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.2px}
.hero p{margin:4px 0 0;font-size:13px;opacity:.78;line-height:1.5}
.crest{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.crest i{width:26px;height:1px;background:var(--gold);display:inline-block}

.bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;position:sticky;top:0;z-index:20}
.bar h2{margin:0;font-size:18px;font-weight:600;flex:1}
.iconbtn{width:40px;height:40px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px}

/* ---- layout ---- */
.wrap{padding:0 16px 40px}
.pull{margin-top:-46px;position:relative;z-index:2}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border:1px solid var(--line)}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;font-size:20px;margin-top:2px}
.stat.gold{background:linear-gradient(145deg,#f6e4b6,#e4bf6d);border:0}
.stat.gold small{color:#6b5214}
.stat.red b{color:var(--red)}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 14px;text-align:left;cursor:pointer;
  box-shadow:0 8px 22px -14px rgba(11,61,51,.5);transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:12px;min-height:116px}
.tile:active{transform:scale(.97)}
.tile .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--g3),var(--g1))}
.tile .ic svg{width:24px;height:24px}
.tile.primary{grid-column:span 2;background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff;border:0;flex-direction:row;align-items:center;min-height:92px}
.tile.primary .ic{background:rgba(255,255,255,.16);color:var(--gold)}
.tile.primary span{font-size:19px;font-weight:700}
.tile.primary em{display:block;font-style:normal;font-weight:400;font-size:12px;opacity:.75;margin-top:2px}
.tile span{font-weight:600;font-size:15px}
.banner{margin-top:16px;background:#fff5dc;border:1px solid #efd9a0;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px}
.banner button{margin-left:auto;border:0;background:var(--gold2);color:#fff;border-radius:12px;padding:8px 12px;font-weight:600}
.note{color:var(--muted);font-size:12px;text-align:center;margin-top:22px}

/* ---- cards / forms ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 8px 24px -18px rgba(11,61,51,.6);margin-top:14px}
.card h3{margin:0 0 12px;font-size:14px;color:var(--g2);letter-spacing:.3px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
label:first-child{margin-top:0}
input,textarea,select{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;outline:none;transition:border .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--g3);box-shadow:0 0 0 4px rgba(22,121,95,.12)}
textarea{min-height:130px;resize:vertical;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dueBox{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#0f5a4a,#0b3d33);color:#fff}
.dueBox small{opacity:.75}.dueBox b{font-size:24px;color:var(--gold)}

.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.main{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2b2006;box-shadow:0 10px 20px -10px rgba(185,141,53,.9)}
.btn.green{background:linear-gradient(135deg,var(--g3),var(--g1));color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:#fdecea;color:var(--red)}
.btn.block{width:100%}.btn.sm{padding:10px 14px;font-size:14px;border-radius:13px}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.btns .btn{flex:1;min-width:130px}

/* ---- list ---- */
.search{position:sticky;top:calc(env(safe-area-inset-top) + 64px);z-index:10;background:var(--bg);padding:12px 0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--g1);border-color:var(--g1);color:#fff}
.order{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px;cursor:pointer;box-shadow:0 6px 18px -16px rgba(0,0,0,.6)}
.order .sn{min-width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--g3),var(--g1));color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:15px}
.order .mid{flex:1;min-width:0}.order .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order .mid small{color:var(--muted);font-size:12.5px}
.order .end{text-align:right}.order .end b{display:block}
.tag{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;margin-top:4px;font-weight:600}
.tag.due{background:#fdecea;color:var(--red)}.tag.ok{background:#e3f5ec;color:var(--ok)}.tag.pend{background:#fff1d6;color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:50px 0}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(8,24,20,.55);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:44px;height:5px;border-radius:9px;background:#cfc8b7;margin:6px auto 14px}
.sheet h3{margin:0 0 4px;font-size:19px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}.kv:last-child{border:0}
.kv span{color:var(--muted)}
.paper{display:flex;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:4px}
.paper button{flex:1;border:0;border-radius:11px;padding:10px;background:transparent;font-weight:600;cursor:pointer}
.paper button.on{background:var(--g1);color:#fff}
.preview{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;overflow:auto;text-align:center}
.preview canvas{max-width:100%;image-rendering:pixelated;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.dev{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:14px;margin-top:8px;background:#fff}
.dev b{flex:1}.dev.on{border-color:var(--ok);background:#effaf4}

/* ---- auth ---- */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;background:radial-gradient(110% 80% at 80% 0,#1d8a6e,transparent 60%),linear-gradient(170deg,var(--g1),#06251e);color:#fff}
.auth .logo{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#f6e4b6,#cfa24b);color:#2b2006;font-size:30px;font-weight:800;font-family:Georgia,serif;margin-bottom:20px;box-shadow:0 18px 34px -14px #000}
.auth h1{margin:0;font-size:28px}.auth p{opacity:.75;margin:6px 0 22px}
.auth input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff;margin-bottom:12px}
.auth input::placeholder{color:rgba(255,255,255,.55)}
.auth .err{color:#ffb4a8;min-height:20px;font-size:14px}
.auth .small{font-size:12px;opacity:.6;margin-top:18px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translate(-50%,30px);background:#10231e;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90%;text-align:center;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--red)}
.big{font-size:30px;font-weight:800}
.sub{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 4px}
.sub h4{margin:0;font-size:15px}
.mrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line)}
.mrow:last-child{border:0}
.bar-in{height:8px;border-radius:9px;background:#e9e3d3;overflow:hidden;margin-top:6px}.bar-in i{display:block;height:100%;background:linear-gradient(90deg,var(--g3),var(--gold))}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media print{body *{display:none}}
.tile[data-go=settings]{grid-column:span 2;flex-direction:row;align-items:center;min-height:78px}
